# Pubblica automaticamente l'app su GitHub Pages a ogni push su main
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Crea la build di produzione
        run: npm run build
        env:
          # Deve coincidere con il nome del repository GitHub
          VITE_BASE_PATH: /pwa-note-personali/
          # Identifica ogni deploy: l'app svuota cache PWA quando cambia
          VITE_APP_BUILD: ${{ github.sha }}

      - name: Carica artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
